<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>R2 Benchmark</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <main class="page">
        <header class="header">
            <div>
                <h1>R2 benchmark</h1>
                <p class="muted">Start a benchmark job and watch the metrics update.</p>
            </div>
            <nav class="nav" aria-label="Primary">
                <a href="/jobs.html">Jobs</a>
            </nav>
        </header>

        <section class="panel">
            <h2>Start job</h2>
            <form id="startForm" class="form">
                <div class="field">
                    <label for="targetRPS">Target RPS (aggregate)</label>
                    <input id="targetRPS" type="number" value="80000" min="1" step="1000" required />
                </div>

                <div class="field">
                    <label for="agents">Agents (load-generator VMs)</label>
                    <input id="agents" type="number" value="8" min="1" max="512" step="1" required />
                    <p class="muted" id="perAgentHint"></p>
                </div>

                <div class="field">
                    <label for="workersPerAgent">Workers per agent</label>
                    <input id="workersPerAgent" type="number" value="512" min="1" step="1" required />
                    <p class="muted">In-flight requests per VM. Pacing is done by the rate limiter; this only has to be high enough not to be the bottleneck.</p>
                </div>

                <div class="field">
                    <label for="duration">Duration (minutes)</label>
                    <input id="duration" type="number" value="15" min="1" max="120" step="1" required />
                </div>

                <div class="field">
                    <label for="startDelaySeconds">Start delay (seconds)</label>
                    <input id="startDelaySeconds" type="number" value="30" min="0" max="600" step="5" required />
                    <p class="muted">Time for every agent to check in and warm its connection pool so all VMs start together.</p>
                </div>

                <div class="field field-check">
                    <label for="unthrottled">
                        <input id="unthrottled" type="checkbox" />
                        Unthrottled (ignore target RPS, run flat out)
                    </label>
                </div>

                <button id="startButton" type="submit">Start</button>
                <p id="message" class="message" role="status"></p>
            </form>
        </section>
    </main>

    <script src="/app.js"></script>
    <script>
        const form = document.getElementById("startForm");
        const button = document.getElementById("startButton");
        const message = document.getElementById("message");
        const targetRPS = document.getElementById("targetRPS");
        const agents = document.getElementById("agents");
        const unthrottled = document.getElementById("unthrottled");
        const perAgentHint = document.getElementById("perAgentHint");

        // Sizing is an explicit operator decision now: the number of agents is
        // however many VMs Terraform provisioned, not something the UI can
        // derive. All the hint does is show the resulting per-VM rate.
        function updatePerAgentHint() {
            const total = Math.floor(Number(targetRPS.value)) || 0;
            const count = Math.floor(Number(agents.value)) || 0;
            if (unthrottled.checked) {
                perAgentHint.textContent = "Unthrottled: each agent runs as fast as its workers allow.";
            } else if (count > 0 && total >= count) {
                perAgentHint.textContent = `~${Math.floor(total / count).toLocaleString()} RPS per agent.`;
            } else {
                perAgentHint.textContent = "Target RPS must be at least the number of agents.";
            }
        }

        for (const el of [targetRPS, agents, unthrottled]) {
            el.addEventListener("input", updatePerAgentHint);
            el.addEventListener("change", updatePerAgentHint);
        }
        updatePerAgentHint();

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            button.disabled = true;
            message.className = "message";
            message.textContent = "Starting...";

            try {
                const data = await api("/api/v1/start", {
                    method: "POST",
                    body: {
                        targetRPS: Number(targetRPS.value),
                        agents: Number(agents.value),
                        workersPerAgent: Number(document.getElementById("workersPerAgent").value),
                        duration: Number(document.getElementById("duration").value),
                        startDelaySeconds: Number(document.getElementById("startDelaySeconds").value),
                        unthrottled: unthrottled.checked,
                    },
                });

                if (!data.jobId) {
                    throw new Error(data.message || "Missing jobId in response");
                }
                window.location.href = `/watch.html?jobId=${encodeURIComponent(data.jobId)}`;
            } catch (error) {
                message.className = "message error";
                message.textContent = error instanceof Error ? error.message : String(error);
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
