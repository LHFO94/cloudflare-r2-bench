<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch R2 Benchmark</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
</head>
<body>
    <main class="page">
        <header class="header">
            <div>
                <h1>Job <span id="jobId">-</span></h1>
                <div class="meta">
                    <span>Created: <strong id="createdAt">-</strong></span>
                    <span>Last poll: <strong id="lastPoll">-</strong></span>
                    <span id="pollState">loading</span>
                </div>
            </div>
            <div class="actions">
                <nav class="nav" aria-label="Primary">
                    <a href="/jobs.html">Jobs</a>
                </nav>
                <button id="stopButton" class="danger" type="button">Stop</button>
                <span id="status" class="pill status-unknown">unknown</span>
            </div>
        </header>

        <section class="grid summary">
            <div class="card">
                <div class="label">RPS</div>
                <div id="rps" class="value">-</div>
            </div>
            <div class="card">
                <div class="label">Latency (mean)</div>
                <div id="latency" class="value">-</div>
            </div>
            <div class="card">
                <div class="label">Latency p95 / p99</div>
                <div id="tail" class="value">-</div>
            </div>
            <div class="card">
                <div class="label">Throughput</div>
                <div id="throughput" class="value">-</div>
            </div>
            <div class="card">
                <div class="label">Active agents</div>
                <div id="runningContainers" class="value">0</div>
            </div>
            <div class="card">
                <div class="label">Status</div>
                <div id="statusText" class="value">-</div>
            </div>
        </section>

        <section class="layout">
            <div class="charts">
                <section class="panel">
                    <h2>RPS over time</h2>
                    <div class="chart-wrap"><canvas id="rpsChart"></canvas></div>
                </section>
                <section class="panel">
                    <h2>Latency over time (mean / p95 / p99)</h2>
                    <div class="chart-wrap"><canvas id="latencyChart"></canvas></div>
                </section>
                <section class="panel">
                    <h2>Error m1 rate over time</h2>
                    <div class="chart-wrap"><canvas id="errorM1RateChart"></canvas></div>
                </section>
                <section class="panel">
                    <h2>Reporting agents over time</h2>
                    <div class="chart-wrap"><canvas id="workersChart"></canvas></div>
                </section>
            </div>

            <section class="panel">
                <h2>Recent samples</h2>
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>RPS</th>
                                <th>Errors/s</th>
                                <th>Mean</th>
                                <th>p95</th>
                                <th>p99</th>
                            </tr>
                        </thead>
                        <tbody id="sampleRows">
                            <tr><td colspan="6">No data yet</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </section>
    </main>

    <script src="/app.js"></script>
    <script>
        // app.js strips ?token= from the URL on load, so read the remaining
        // params afterwards.
        const params = new URL(window.location.href).searchParams;
        const jobId = params.get("jobId");
        // Agents report every 10s; polling faster only costs D1 reads.
        const pollMs = 10000;

        const el = {
            jobId: document.getElementById("jobId"),
            createdAt: document.getElementById("createdAt"),
            lastPoll: document.getElementById("lastPoll"),
            pollState: document.getElementById("pollState"),
            status: document.getElementById("status"),
            statusText: document.getElementById("statusText"),
            rps: document.getElementById("rps"),
            latency: document.getElementById("latency"),
            tail: document.getElementById("tail"),
            throughput: document.getElementById("throughput"),
            runningContainers: document.getElementById("runningContainers"),
            sampleRows: document.getElementById("sampleRows"),
            stopButton: document.getElementById("stopButton"),
        };

        let loading = false;
        let rpsChart;
        let latencyChart;
        let errorM1RateChart;
        let workersChart;

        if (!jobId) {
            el.pollState.textContent = "missing jobId";
            throw new Error("missing jobId");
        }

        el.jobId.textContent = jobId;

        function number(value, digits = 1) {
            const n = Number(value);
            return Number.isFinite(n) ? n.toLocaleString(undefined, { maximumFractionDigits: digits }) : "-";
        }

        function time(value) {
            if (!value) return "-";
            const d = new Date(value);
            return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleTimeString();
        }

        function dateTime(value) {
            if (!value) return "-";
            const d = new Date(value);
            return Number.isNaN(d.getTime()) ? String(value) : d.toLocaleString();
        }

        function gbps(bytesPerMinute) {
            const n = Number(bytesPerMinute);
            if (!Number.isFinite(n) || n <= 0) return "-";
            return `${(n * 8 / 60 / 1e9).toLocaleString(undefined, { maximumFractionDigits: 2 })} Gbps`;
        }

        function statusClass(status) {
            return `pill status-${String(status || "unknown").toLowerCase()}`;
        }

        function canStop(status) {
            return !["completed", "stopped", "stopping", "failed"].includes(String(status || "").toLowerCase());
        }

        function makeChart(id, series) {
            return new Chart(document.getElementById(id), {
                type: "line",
                data: {
                    labels: [],
                    datasets: series.map(({ label, color }) => ({
                        label, data: [], borderColor: color, borderWidth: 2, pointRadius: 1, tension: 0.2,
                    })),
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: { legend: { display: series.length > 1 } },
                    scales: { y: { beginAtZero: true } },
                },
            });
        }

        function ensureCharts() {
            if (!rpsChart) rpsChart = makeChart("rpsChart", [{ label: "RPS", color: "#2563eb" }]);
            // Mean, p95 and p99 share an axis: the gap between them is the
            // point of the chart, and separate panels would hide it.
            if (!latencyChart) latencyChart = makeChart("latencyChart", [
                { label: "mean", color: "#b45309" },
                { label: "p95", color: "#7c3aed" },
                { label: "p99", color: "#db2777" },
            ]);
            if (!errorM1RateChart) errorM1RateChart = makeChart("errorM1RateChart", [{ label: "Errors/s", color: "#dc2626" }]);
            if (!workersChart) workersChart = makeChart("workersChart", [{ label: "Agents", color: "#059669" }]);
        }

        function metricTime(metric, index) {
            return metric.createdAt || metric.created_at || metric.CREATED_AT || String(index + 1);
        }

        function updateCharts(metrics) {
            ensureCharts();
            const labels = metrics.map((metric, index) => time(metricTime(metric, index)));
            rpsChart.data.labels = labels;
            rpsChart.data.datasets[0].data = metrics.map((metric) => Number(metric.rps || 0));
            latencyChart.data.labels = labels;
            latencyChart.data.datasets[0].data = metrics.map((metric) => Number(metric.latency || 0));
            latencyChart.data.datasets[1].data = metrics.map((metric) => Number(metric.p95 || 0));
            latencyChart.data.datasets[2].data = metrics.map((metric) => Number(metric.p99 || 0));
            errorM1RateChart.data.labels = labels;
            errorM1RateChart.data.datasets[0].data = metrics.map((metric) => Number(metric.errorM1Rate || 0));
            workersChart.data.labels = labels;
            workersChart.data.datasets[0].data = metrics.map((metric) => Number(metric.workerCount || 0));
            rpsChart.update();
            latencyChart.update();
            errorM1RateChart.update();
            workersChart.update();
        }

        function updateTable(metrics) {
            const rows = metrics.slice().reverse().slice(0, 20);
            if (rows.length === 0) {
                el.sampleRows.innerHTML = `<tr><td colspan="6">No data yet</td></tr>`;
                return;
            }

            el.sampleRows.innerHTML = rows.map((metric, index) => `
                <tr>
                    <td>${time(metricTime(metric, index))}</td>
                    <td>${number(metric.rps)}</td>
                    <td>${number(metric.errorM1Rate)}</td>
                    <td>${number(metric.latency)} ms</td>
                    <td>${number(metric.p95)} ms</td>
                    <td>${number(metric.p99)} ms</td>
                </tr>
            `).join("");
        }

        function render(data) {
            const metrics = Array.isArray(data.metrics) ? data.metrics.slice().reverse() : [];
            const latest = metrics[metrics.length - 1] || {};

            el.createdAt.textContent = dateTime(data.created_at || data.createdAt);
            el.status.textContent = data.status || "unknown";
            el.status.className = statusClass(data.status);
            el.statusText.textContent = data.status || "-";
            el.stopButton.disabled = !canStop(data.status);
            el.rps.textContent = number(latest.rps ?? data.rps);
            el.latency.textContent = `${number(latest.latency ?? data.latency)} ms`;
            el.tail.textContent = `${number(latest.p95)} / ${number(latest.p99)} ms`;
            // BYTES is a per-minute bucket sum, hence /60 to get bits/second.
            el.throughput.textContent = gbps(latest.bytes);
            el.runningContainers.textContent = number(data.runningContainers, 0);
            el.lastPoll.textContent = time(new Date());

            updateCharts(metrics);
            updateTable(metrics);
        }

        async function poll() {
            if (loading) return;
            loading = true;
            el.pollState.textContent = "polling";

            try {
                const data = await api("/api/v1/watch", { method: "POST", body: { jobId } });
                render(data);
                el.pollState.textContent = "ok";
            } catch (error) {
                el.pollState.textContent = error instanceof Error ? error.message : String(error);
            } finally {
                loading = false;
            }
        }

        async function stopJob() {
            el.stopButton.disabled = true;
            el.pollState.textContent = "stopping";

            try {
                const data = await api("/api/v1/stop", { method: "POST", body: { jobId } });
                el.status.textContent = data.status || "STOPPING";
                el.status.className = statusClass(data.status);
                el.statusText.textContent = data.status || "STOPPING";
                await poll();
            } catch (error) {
                el.pollState.textContent = error instanceof Error ? error.message : String(error);
                el.stopButton.disabled = false;
            }
        }

        ensureCharts();
        el.stopButton.addEventListener("click", stopJob);
        poll();
        setInterval(poll, pollMs);
    </script>
</body>
</html>
